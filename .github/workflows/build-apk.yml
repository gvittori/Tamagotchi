- name: Update App Name from Gradle Project Name
        run: |
          PROJECT_NAME=""

          # Extract project name from settings files using sed
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_NAME=$(sed -n 's/.*rootProject\.name\s*=\s*"\([^"]*\)".*/\1/p' settings.gradle.kts)
          elif [ -f "settings.gradle" ]; then
            PROJECT_NAME=$(sed -n "s/.*rootProject\.name\s*=\s*['\"]\([^'\"]*\)['\"].*/\1/p" settings.gradle)
          fi

          # Fallback to repo folder name
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="${GITHUB_REPOSITORY##*/}"
          fi

          echo "Setting application label to: $PROJECT_NAME"

          STRINGS_XML="app/src/main/res/values/strings.xml"
          mkdir -p app/src/main/res/values

          if [ ! -f "$STRINGS_XML" ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n' > "$STRINGS_XML"
          fi

          # Insert or replace app_name using xmlstarlet
          if xmlstarlet sel -t -v "/resources/string[@name='app_name']" "$STRINGS_XML" > /dev/null 2>&1; then
            xmlstarlet ed -L -u "/resources/string[@name='app_name']" -v "$PROJECT_NAME" "$STRINGS_XML"
          else
            xmlstarlet ed -L -s "/resources" -t elem -n "string" -v "$PROJECT_NAME" "$STRINGS_XML"
            xmlstarlet ed -L -i "/resources/string[not(@name)]" -t attr -n "name" -v "app_name" "$STRINGS_XML"
          fi
